services:
  api:
    build: .
    restart: always
    command: sh -c "python scripts/reset_db.py && python scripts/init_refs.py && python scripts/import_data_json.py && uvicorn oc4ids_datastore_api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    network_mode: "host"
    env_file:
      - .env
